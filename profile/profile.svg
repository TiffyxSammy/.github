<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1620" viewBox="0 0 900 1620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="nowPlayingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbeaf0"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <pattern id="pinkDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#f4c0d1" opacity="0.5"/>
    </pattern>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#fbeaf0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
  </defs>

  <rect width="900" height="1620" fill="#faf6f2"/>
  <rect width="900" height="1620" fill="url(#pinkDots)"/>

  <rect x="40" y="40" width="820" height="1540" rx="14" fill="#faf6f2" stroke="#e5dfd5" stroke-width="1"/>

  <!-- ============ HEADER WITH TWINKLING SPARKLES ============ -->
  <g transform="translate(450, 100)">
    <text x="-220" y="-10" font-size="20" opacity="0.6">
      ✨
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="-10" font-size="20" opacity="0.6">
      ✨
      <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="-200" y="40" font-size="14" opacity="0.5">
      ⭐
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="190" y="40" font-size="14" opacity="0.5">
      ⭐
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </text>

    <text text-anchor="middle" font-family="Georgia, serif" font-style="normal" font-size="42" font-weight="500" fill="#2c2c2a">
      <tspan fill="#d4537e">sammy</tspan>
      <tspan fill="#888780" font-style="italic" font-size="32" dx="8" dy="-2">&amp;</tspan>
      <tspan fill="#3b6d11" dx="8" dy="2">tiffy</tspan>
    </text>
    <text y="34" text-anchor="middle" font-style="italic" font-size="15" fill="#5f5e5a">
      a uga duo · est. fall 2019, cs 1301, one empty seat
    </text>
  </g>

  <!-- ============ TERMINAL WITH TYPED-IN ANIMATION ============ -->
  <g transform="translate(80, 180)">
    <rect width="740" height="240" rx="8" fill="#0d0d0f"/>
    <rect width="740" height="36" rx="8" fill="#1a1a1c"/>
    <rect y="28" width="740" height="8" fill="#1a1a1c"/>
    <line x1="0" y1="36" x2="740" y2="36" stroke="#2c2c2a" stroke-width="1"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="90" y="22" font-family="'Courier New', Courier, monospace" font-size="12" fill="#888780">~/swamp-castle — zsh</text>

    <g font-family="'Courier New', Courier, monospace" font-size="14">
      <text x="20" y="68" fill="#888780" opacity="0">
        $ cd ~/swamp-castle &amp;&amp; ls
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
        <text x="36" y="92" fill="#d3d1c7">🏰  </text>
        <text x="68" y="92" fill="#f4c0d1">princess.sammy</text>
        <text x="220" y="92" fill="#d3d1c7">🌿  </text>
        <text x="252" y="92" fill="#c0dd97">ogre.tiffy</text>
      </g>

      <text x="20" y="124" fill="#888780" opacity="0">
        $ cat README.txt
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.9s" fill="freeze"/>
        <text x="36" y="148" fill="#faf6f2">welcome to our swamp castle <tspan fill="#f4c0d1">✨</tspan><tspan fill="#c0dd97">🧅</tspan></text>
        <text x="36" y="168" fill="#faf6f2">where a disney princess and an ogre</text>
        <text x="36" y="188" fill="#faf6f2">write some <tspan fill="#5f5e5a" text-decoration="line-through">code</tspan>, scheme up bots,</text>
        <text x="36" y="208" fill="#faf6f2">ship side projects, rewatch shrek</text>
        <text x="36" y="228" fill="#faf6f2">and disney movies, and somehow stay best friends.</text>
      </g>

      <!-- blinking cursor -->
      <rect x="18" y="248" width="9" height="14" fill="#c0dd97" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.1s" begin="2.5s" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" begin="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ============ ORIGIN STORY ============ -->
  <g transform="translate(80, 450)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.8s" fill="freeze"/>

    <rect width="740" height="200" rx="10" fill="#ffffff" stroke="#e5dfd5" stroke-width="1"/>
    <rect x="20" y="-9" width="120" height="18" rx="2" fill="#faf6f2"/>
    <text x="80" y="4" text-anchor="middle" font-size="11" font-weight="500" fill="#888780" letter-spacing="1.5">📜 ORIGIN STORY</text>

    <g font-size="14" fill="#444441">
      <text x="20" y="36">
        <tspan fill="#d4537e" font-weight="500">📍 location:</tspan>
        <tspan fill="#444441"> uga, cs 1301 lab, fall 2019</tspan>
      </text>
      <text x="20" y="60">
        <tspan fill="#d4537e" font-weight="500">📍 incident:</tspan>
        <tspan fill="#444441"> someone dropped the class. one empty seat. one fateful decision.</tspan>
      </text>
      <text x="20" y="84">
        <tspan fill="#d4537e" font-weight="500">📍 sammy, scooting one seat over:</tspan>
      </text>
    </g>

    <rect x="20" y="100" width="700" height="40" fill="#fbeaf0"/>
    <rect x="20" y="100" width="3" height="40" fill="#d4537e"/>
    <text x="40" y="125" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#993556">"i guess ill sit here"</text>

    <text x="20" y="170" font-size="14">
      <tspan fill="#3b6d11" font-weight="500">→ tiffy:</tspan>
    </text>
    <rect x="80" y="156" width="220" height="22" rx="4" fill="#f1efe8"/>
    <text x="90" y="171" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3b6d11">connection_established.exe ✓</text>
  </g>

  <!-- ============ DUO PROFILE CARDS ============ -->
  <g transform="translate(80, 690)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.2s" fill="freeze"/>

      <rect width="358" height="180" rx="10" fill="#fbeaf0" stroke="#f4c0d1" stroke-width="1"/>
      <rect x="220" y="-10" width="120" height="22" rx="11" fill="#ffffff" stroke="#f4c0d1" stroke-width="1"/>
      <text x="280" y="5" text-anchor="middle" font-size="11" fill="#993556">✨ the princess</text>

      <text x="20" y="40" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="500" fill="#993556">sammy</text>

      <g font-size="13" fill="#5f5e5a">
        <text x="20" y="68">📍 georgia · she/her</text>
        <text x="20" y="90">⚡ tpm @ amazon</text>
        <text x="20" y="112">🎓 uga · cs + cog sci</text>
      </g>

      <text x="20" y="148" font-style="italic" font-size="13" fill="#d4537e">"i'm the problem, it's me (fixing it)"</text>
    </g>

    <g transform="translate(382, 0)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>

      <rect width="358" height="180" rx="10" fill="#1a1a1c" stroke="#3b6d11" stroke-width="1"/>
      <rect x="220" y="-10" width="120" height="22" rx="11" fill="#0d0d0f" stroke="#3b6d11" stroke-width="1"/>
      <text x="280" y="5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c0dd97">🧅 the ogre</text>

      <text x="20" y="40" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="500" fill="#c0dd97">&gt; tiffy.exe</text>

      <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#d3d1c7">
        <text x="20" y="68">📍 the swamp · she/ogre</text>
        <text x="20" y="90">⚙️ sde @ ncr</text>
        <text x="20" y="112">🎓 uga · cs + cog sci</text>
      </g>

      <text x="20" y="148" font-family="'Courier New', Courier, monospace" font-size="12" fill="#c0dd97">"get out of my swamp (jk push your branch)"</text>
    </g>
  </g>

  <!-- ============ ACHIEVEMENT WALL (STAGGERED FADE-IN) ============ -->
  <g transform="translate(80, 910)">
    <text x="0" y="0" font-size="11" font-weight="500" fill="#5f5e5a" letter-spacing="1.5">🏆 THINGS WE'VE SURVIVED · ACHIEVEMENT WALL</text>

    <g transform="translate(0, 20)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
      <rect width="364" height="100" rx="10" fill="#ffffff" stroke="#e5dfd5" stroke-width="1"/>
      <text x="182" y="40" text-anchor="middle" font-size="32">💻</text>
      <text x="182" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">cs 1301</text>
      <text x="182" y="86" text-anchor="middle" font-size="11" fill="#888780">where it all began</text>
    </g>

    <g transform="translate(376, 20)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4s" fill="freeze"/>
      <rect width="364" height="100" rx="10" fill="#ffffff" stroke="#e5dfd5" stroke-width="1"/>
      <text x="182" y="40" text-anchor="middle" font-size="32">😷</text>
      <text x="182" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">a global pandemic</text>
      <text x="182" y="86" text-anchor="middle" font-size="11" fill="#888780">mid-degree, no warning</text>
    </g>

    <g transform="translate(0, 132)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.2s" fill="freeze"/>
      <rect width="364" height="100" rx="10" fill="#ffffff" stroke="#e5dfd5" stroke-width="1"/>
      <text x="182" y="40" text-anchor="middle" font-size="32">🔄</text>
      <text x="182" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">switching to cs late</text>
      <text x="182" y="86" text-anchor="middle" font-size="11" fill="#888780">extra semesters, no regrets</text>
    </g>

    <g transform="translate(376, 132)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.4s" fill="freeze"/>
      <rect width="364" height="100" rx="10" fill="#ffffff" stroke="#e5dfd5" stroke-width="1"/>
      <text x="182" y="40" text-anchor="middle" font-size="32">🎓</text>
      <text x="182" y="68" text-anchor="middle" font-size="14" font-weight="500" fill="#2c2c2a">graduating</text>
      <text x="182" y="86" text-anchor="middle" font-size="11" fill="#888780">eventually. we got there.</text>
    </g>
  </g>

  <!-- ============ NOW PLAYING WITH SPINNING VINYL + PROGRESS BAR ============ -->
  <g transform="translate(80, 1210)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.8s" fill="freeze"/>

    <text x="0" y="0" font-size="11" font-weight="500" fill="#5f5e5a" letter-spacing="1.5">🎧 NOW PLAYING · CASTLE SOUNDTRACK</text>

    <rect y="20" width="740" height="170" rx="14" fill="url(#nowPlayingBg)"/>

    <g transform="translate(20, 40)">
      <!-- spinning vinyl -->
      <g transform="translate(32, 32)">
        <g>
          <circle r="32" fill="url(#vinyl)"/>
          <circle r="6" fill="#fbeaf0"/>
          <circle r="2" fill="#d4537e"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        </g>
        <text y="11" text-anchor="middle" font-size="28">🎀</text>
      </g>

      <text x="80" y="22" font-size="15" font-weight="500" fill="#ffffff">whatever gracie just dropped</text>
      <text x="80" y="42" font-size="13" fill="#ffffff" opacity="0.7">gracie abrams · screaming softly</text>

      <!-- animated progress bar -->
      <rect x="80" y="54" width="500" height="3" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="80" y="54" width="0" height="3" rx="2" fill="#ffffff" opacity="0.95">
        <animate attributeName="width" values="0;500;0" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="590" y="58" font-size="11" fill="#ffffff" opacity="0.6">on repeat</text>
    </g>

    <line x1="20" y1="130" x2="720" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

    <g transform="translate(20, 144)">
      <rect width="48" height="48" rx="8" fill="#0d0d0f" stroke="#3b6d11" stroke-width="1"/>
      <!-- bouncing headphones to suggest bass -->
      <text x="24" y="34" text-anchor="middle" font-size="22">
        🎧
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0;0,-2;0,0" dur="0.6s" repeatCount="indefinite"/>
      </text>

      <text x="64" y="20" font-size="14" font-weight="500" fill="#c0dd97">an unidentified edm drop</text>
      <text x="64" y="38" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c0dd97" opacity="0.7">bpm: too many · location: festival pit</text>

      <text x="660" y="28" font-family="'Courier New', Courier, monospace" font-size="11" fill="#ffffff" opacity="0.6">up next ⏭</text>
    </g>
  </g>

  <text x="450" y="1428" text-anchor="middle" font-size="12" font-style="italic" fill="#888780" opacity="0">
    sad girl pop into bass drop, no transition · iconic
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="5.4s" fill="freeze"/>
  </text>

  <!-- ============ FOOTER WITH PULSING HEART ============ -->
  <line x1="80" y1="1490" x2="820" y2="1490" stroke="#d3d1c7" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="450" y="1518" text-anchor="middle" font-size="12" font-style="italic" fill="#888780">
    built with <tspan font-size="14">
      💖
      <animate attributeName="font-size" values="14;17;14" dur="2s" repeatCount="indefinite"/>
    </tspan> by sammy &amp; <tspan font-size="14">🧅</tspan> by tiffy · pull requests welcome (kinda)
  </text>

</svg>
